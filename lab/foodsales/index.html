<body data-page="demo">
  <a class="skip-link" href="#main">Ir al contenido</a>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="../../index.html">
        <img class="brand__logo" src="../../assets/images/makeAutomatic_v2.png" alt="Logo makeAutomatic">
        <span class="brand__text">makeAutomatic</span>
      </a>
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav class="site-nav" id="site-nav" data-nav>

        <a href="https://wa.me/573233344633" target="_blank" rel="noopener noreferrer">Contacto</a>
      </nav>
    </div>
  </header>

  <main id="main" class="demo-page">
    <section class="demo-shell">
      <div class="container">
        <p class="eyebrow">Demo Local</p>
        <h1>FoodSales</h1>
        <p class="lead lead--compact">Asistente comercial local que interpreta pedidos simples y construye una orden sin conectarse a servicios externos.</p>
        <div class="demo-layout">
          <section class="panel">
            <div class="chat-box" id="foodsales-chat" aria-live="polite"></div>
            <form class="inline-form" id="foodsales-form">
              <label class="sr-only" for="foodsales-input">Mensaje</label>
              <input id="foodsales-input" name="message" type="text" placeholder="Ejemplo: 3 quesos mozzarella y 2 yogures naturales">
              <button class="button" type="submit">Enviar</button>
            </form>
            <div class="button-row">
              <button class="button button--ghost" id="foodsales-clear" type="button">Limpiar</button>
              <button class="button button--ghost" id="foodsales-confirm" type="button">Confirmar orden</button>
            </div>
          </section>
          <aside class="panel panel--soft">
            <h2>Catalogo</h2>
            <p class="panel__intro">Selecciona un producto para completar la caja de texto rapidamente.</p>
            <div class="catalog-list" id="foodsales-catalog"></div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
