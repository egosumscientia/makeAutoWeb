<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Demo local SmartEnergy de makeAutomatic.">
  <title>SmartEnergy | makeAutomatic Lab</title>
  <link rel="stylesheet" href="../../css/styles.css?v=20260329b">
</head>
<body data-page="demo">
  <a class="skip-link" href="#main">Ir al contenido</a>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="../../index.html">
        <img class="brand__logo" src="../../assets/images/makeAutomatic_v2.png" alt="Logo makeAutomatic">
        <span class="brand__text">makeAutomatic</span>
      </a>
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav class="site-nav" id="site-nav" data-nav>
        <a href="../index.html">Volver al Lab</a>
      </nav>
    </div>
  </header>

  <main id="main" class="demo-page">
    <section class="demo-shell">
      <div class="container">
        <p class="eyebrow">Demo Local</p>
        <h1>SmartEnergy</h1>
        <p class="lead lead--compact">Series simuladas de voltaje y potencia con conteo de fallas, ejecutadas 100% en el navegador.</p>
        <div class="demo-layout demo-layout--single">
          <section class="panel panel--centered">
            <canvas id="smartenergy-voltage" class="chart-canvas chart-canvas--wide" width="560" height="180" aria-label="Serie de voltaje"></canvas>
            <canvas id="smartenergy-power" class="chart-canvas chart-canvas--wide" width="560" height="180" aria-label="Serie de potencia"></canvas>
            <div class="stat-banner">
              <span>Fallas detectadas</span>
              <strong id="smartenergy-anomalies">0</strong>
            </div>
            <button class="button" id="smartenergy-refresh" type="button">Simular fallas</button>
          </section>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p class="site-footer__copy">&copy; <span data-current-year></span> makeAutomatic</p>
    </div>
  </footer>

  <script type="module" src="../../js/components/smartenergy-demo.js?v=20260329b"></script>
</body>
</html>
