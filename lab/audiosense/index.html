<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Demo local AudioSense de makeAutomatic.">
  <title>AudioSense | makeAutomatic Lab</title>
  <link rel="stylesheet" href="../../css/styles.css?v=20260329b">

<body data-page="demo">
  <a class="skip-link" href="#main">Ir al contenido</a>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="../../index.html">
        <img class="brand__logo" src="../../assets/images/makeAutomatic_v2.png" alt="Logo makeAutomatic">
        <span class="brand__text">makeAutomatic</span>
      </a>
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav">Menu</button>

        <a href="../index.html">Volver al Lab</a>
      </nav>
    </div>
  </header>

  <main id="main" class="demo-page">
    <section class="demo-shell">
      <div class="container">
        <p class="eyebrow">Demo Local</p>
        <h1>AudioSense</h1>
        <p class="lead lead--compact">Simulacion local de firma acustica industrial con diagnostico resumido.</p>
        <div class="demo-layout">
          <section class="panel panel--centered">
            <canvas id="audiosense-wave" class="chart-canvas chart-canvas--wide" width="560" height="220" aria-label="Forma de onda"></canvas>

          <aside class="panel panel--soft">

            <div class="metric-list" id="audiosense-summary"></div>

  <footer class="site-footer">
